<!DOCTYPE html>
<html
  xmlns="http://www.w3.org/1999/xhtml"
  xmlns:xul="http://www.mozilla.org/keymaster/gatekeeper/there.is.only.xul"
  windowtype="geckogx:main"
  width="1400"
  height="900"
  persist="width height screenX screenY sizemode"
>
  <head>
    <meta charset="utf-8" />
    <title>Gecko GX</title>
    <link
      rel="stylesheet"
      href="chrome://global/skin/design-system/tokens-platform.css"
    />
    <link
      rel="stylesheet"
      href="chrome://browser/content/minibrowser/minibrowser.css"
    />
    <script src="chrome://global/content/globalOverlay.js" />
    <script src="chrome://browser/content/minibrowser/minibrowser.js" />
    <script src="chrome://browser/content/minibrowser/gx-tabs.js" />
    <script src="chrome://browser/content/minibrowser/gx-integration.js" />
    <script src="chrome://browser/content/minibrowser/gx-notify.js" />
    <script src="chrome://browser/content/minibrowser/gx-shields.js" />
    <script src="chrome://browser/content/minibrowser/gx-tools.js" />
    <script src="chrome://browser/content/minibrowser/gx-sidebar.js" />
    <script src="chrome://browser/content/minibrowser/gx-control.js" />
    <script src="chrome://browser/content/minibrowser/gx-start.js" />
    <script src="chrome://browser/content/minibrowser/gx-settings.js" />
  </head>
  <body>
    <nav id="sidebar">
      <div id="logo" title="Gecko GX">GX</div>
      <button
        class="sidebar-btn"
        data-view="control"
        data-icon="gauge"
        title="GX Control (Strg+Umschalt+Esc)"
      >
        <span id="sidebar-ram" class="mini-meter"><span></span></span>
      </button>
      <div class="sidebar-sep"></div>
      <div id="sidebar-panels"></div>
      <button
        id="panel-add"
        class="sidebar-btn"
        data-icon="plus"
        title="Web-Panel hinzufügen"
      ></button>
      <div class="spacer"></div>
      <button
        class="sidebar-btn"
        data-view="history"
        data-icon="history"
        title="Verlauf (Strg+H)"
      ></button>
      <button
        class="sidebar-btn"
        data-view="bookmarks"
        data-icon="bookmark"
        title="Lesezeichen"
      ></button>
      <button
        class="sidebar-btn"
        data-view="reading"
        data-icon="book"
        title="Leseliste"
      ></button>
      <button
        class="sidebar-btn"
        data-view="passwords"
        data-icon="key"
        title="Passwörter"
      ></button>
      <button
        class="sidebar-btn"
        data-view="downloads"
        data-icon="download"
        title="Downloads (Strg+J)"
      >
        <span id="sidebar-dl-badge" class="badge" hidden="hidden"></span>
      </button>
      <button
        class="sidebar-btn"
        data-view="settings"
        data-icon="sliders"
        title="Einstellungen"
      ></button>
    </nav>

    <aside id="panel-host" hidden="hidden">
      <header id="panel-header">
        <span id="panel-title"></span>
        <button
          id="panel-reload"
          class="icon-btn"
          data-icon="reload"
          title="Panel neu laden"
        ></button>
        <button
          id="panel-popout"
          class="icon-btn"
          data-icon="external"
          title="In neuem Tab öffnen"
        ></button>
        <button
          id="panel-close"
          class="icon-btn"
          data-icon="close"
          title="Schließen"
        ></button>
      </header>
      <div id="panel-stack">
        <section class="view" data-view="control">
          <div class="card">
            <div class="card-head">
              <span>CPU</span><b id="cpu-value">0 %</b>
            </div>
            <canvas id="cpu-graph" class="graph"></canvas>
          </div>
          <div class="card">
            <div class="card-head">
              <span>RAM</span><b id="ram-value">0 MB</b>
            </div>
            <canvas id="ram-graph" class="graph"></canvas>
          </div>
          <div class="card">
            <label class="switch-row">
              <span>
                <b>RAM-Limiter</b>
                <small
                  >Legt Hintergrund-Tabs schlafen, wenn das Limit überschritten
                  wird.</small
                >
              </span>
              <input type="checkbox" id="ram-limit-on" class="switch" />
            </label>
            <div class="slider-row">
              <input type="range" id="ram-limit" min="512" step="256" />
              <output id="ram-limit-label"></output>
            </div>
            <small id="ram-slept" class="muted"></small>
          </div>
          <div class="card">
            <label class="switch-row">
              <span>
                <b>CPU-Limiter</b>
                <small
                  >Begrenzt die Bildrate und drosselt Timer in
                  Hintergrund-Tabs.</small
                >
              </span>
              <input type="checkbox" id="cpu-limit-on" class="switch" />
            </label>
            <div class="segmented" id="cpu-limit-fps">
              <button data-fps="30">30 FPS</button>
              <button data-fps="60">60 FPS</button>
              <button data-fps="120">120 FPS</button>
            </div>
          </div>
          <div class="card">
            <label class="switch-row">
              <span>
                <b>Werbe- und Tracker-Blocker</b>
                <small
                  >Blockiert Tracker, Social-Tracker, Krypto-Miner und
                  Fingerprinter.</small
                >
              </span>
              <input type="checkbox" id="blocker-on" class="switch" />
            </label>
            <label class="switch-row">
              <span><b>Popups blockieren</b></span>
              <input type="checkbox" id="popups-on" class="switch" />
            </label>
            <div class="stat-row">
              <span>Blockiert auf dieser Seite</span><b id="blocked-page">0</b>
            </div>
            <div class="stat-row">
              <span>Blockiert insgesamt</span><b id="blocked-total">0</b>
            </div>
          </div>
          <div class="card">
            <div class="card-head"><span>Prozesse</span></div>
            <div id="proc-list"></div>
          </div>
        </section>

        <section class="view" data-view="history">
          <div class="view-toolbar">
            <input
              id="history-search"
              type="search"
              placeholder="Verlauf durchsuchen"
            />
            <button id="history-clear" class="text-btn">Löschen</button>
          </div>
          <div id="history-list" class="item-list"></div>
        </section>

        <section class="view" data-view="bookmarks">
          <div class="view-toolbar">
            <input
              id="bookmarks-search"
              type="search"
              placeholder="Lesezeichen durchsuchen"
            />
          </div>
          <div id="bookmarks-list" class="item-list"></div>
        </section>

        <section class="view" data-view="downloads">
          <div class="view-toolbar">
            <span class="muted" id="downloads-summary"></span>
            <button id="downloads-clear" class="text-btn">Liste leeren</button>
          </div>
          <div id="downloads-list" class="item-list"></div>
        </section>

        <section class="view" data-view="reading">
          <div class="view-toolbar">
            <span class="muted">Später lesen</span>
            <button id="reading-add" class="text-btn">
              Aktuelle Seite hinzufügen
            </button>
          </div>
          <div id="reading-list" class="item-list"></div>
        </section>

        <section class="view" data-view="passwords">
          <div class="view-toolbar">
            <input
              id="passwords-search"
              type="search"
              placeholder="Passwörter durchsuchen"
            />
          </div>
          <div id="passwords-list" class="item-list"></div>
        </section>

        <section class="view" data-view="settings">
          <div id="settings"></div>
        </section>
      </div>
      <div id="panel-resizer"></div>
    </aside>

    <main id="main">
      <div id="tabstrip">
        <div id="tabs"></div>
        <button
          id="newtab"
          class="icon-btn"
          data-icon="plus"
          title="Neuer Tab (Strg+T)"
        ></button>
      </div>

      <div id="toolbar">
        <button
          id="back"
          class="icon-btn"
          data-icon="back"
          title="Zurück (Alt+←)"
        ></button>
        <button
          id="forward"
          class="icon-btn"
          data-icon="forward"
          title="Vor (Alt+→)"
        ></button>
        <button id="reload" class="icon-btn" title="Neu laden (F5)"></button>
        <button
          id="home"
          class="icon-btn"
          data-icon="home"
          title="Startseite"
        ></button>
        <div id="urlbar-wrap">
          <span id="identity" data-icon="lock"></span>
          <input
            id="urlbar"
            type="text"
            spellcheck="false"
            autocomplete="off"
            placeholder="Suchen oder Adresse eingeben"
          />
          <button
            id="zoom"
            class="pill"
            hidden="hidden"
            title="Zoom zurücksetzen"
          ></button>
          <button
            id="notif-anchor"
            class="icon-btn"
            data-icon="key"
            hidden="hidden"
            title="Offene Anfrage anzeigen"
          ></button>
          <button
            id="qr-btn"
            class="icon-btn"
            data-icon="qr"
            title="QR-Code"
          ></button>
          <button
            id="reading-btn"
            class="icon-btn"
            data-icon="book"
            title="Zur Leseliste hinzufügen"
          ></button>
          <button
            id="star"
            class="icon-btn"
            data-icon="star"
            title="Lesezeichen (Strg+D)"
          ></button>
          <div id="urlbar-results" hidden="hidden"></div>
        </div>
        <button
          id="shield"
          class="icon-btn"
          data-icon="shield"
          title="Gecko GX Shields"
        >
          <span id="shield-count" class="badge"></span>
        </button>
        <button
          id="menu-btn"
          class="icon-btn"
          data-icon="dots"
          title="Menü"
        ></button>
      </div>

      <div id="bookmarksbar"></div>

      <div id="content-area">
        <div id="browsers"></div>
        <div id="start">
          <div id="start-inner">
            <div id="start-clock"></div>
            <div id="start-date"></div>
            <form id="start-form">
              <span data-icon="search"></span>
              <input
                id="start-search"
                type="text"
                autocomplete="off"
                placeholder="Im Web suchen"
              />
            </form>
            <div id="tiles"></div>
            <div id="start-widgets">
              <div class="widget">
                <b id="w-blocked">0</b
                ><span>Werbung &amp; Tracker blockiert</span>
              </div>
              <div class="widget">
                <b id="w-time">0 s</b><span>Zeit gespart (geschätzt)</span>
              </div>
              <div class="widget">
                <b id="w-data">0 KB</b><span>Daten gespart (geschätzt)</span>
              </div>
              <div class="widget">
                <b id="w-ram">–</b><span>RAM-Nutzung</span>
              </div>
            </div>
            <div id="private-info">
              <b>Privates Fenster</b>
              <span
                >Gecko GX speichert hier keinen Verlauf, keine Cookies und keine
                Sitzung. Downloads und Lesezeichen bleiben erhalten. Deine
                Internetanbieter und besuchte Seiten sehen dich trotzdem.</span
              >
            </div>
          </div>
          <form id="tile-editor" hidden="hidden">
            <b>Kachel hinzufügen</b>
            <input id="tile-name" type="text" placeholder="Name" />
            <input
              id="tile-url"
              type="text"
              placeholder="https://…"
              required="required"
            />
            <div class="row">
              <button type="button" id="tile-cancel" class="text-btn">
                Abbrechen
              </button>
              <button type="submit" class="accent-btn">Hinzufügen</button>
            </div>
          </form>
        </div>
        <div id="findbar" hidden="hidden">
          <input id="find-input" type="text" placeholder="Auf Seite suchen" />
          <span id="find-count"></span>
          <button
            id="find-prev"
            class="icon-btn"
            data-icon="up"
            title="Vorheriger Treffer"
          ></button>
          <button
            id="find-next"
            class="icon-btn"
            data-icon="down"
            title="Nächster Treffer"
          ></button>
          <label
            ><input type="checkbox" id="find-highlight" /> Alle
            hervorheben</label
          >
          <button
            id="find-close"
            class="icon-btn"
            data-icon="close"
            title="Schließen"
          ></button>
        </div>
        <div id="status" hidden="hidden"></div>
        <div id="notification-popup" hidden="hidden"></div>
      </div>
    </main>

    <xul:menupopup id="contentAreaContextMenu" />
    <xul:menupopup id="tabContextMenu" />
    <xul:menupopup id="mainMenu" />
    <xul:tooltip id="remoteBrowserTooltip" />
    <xul:panel
      type="autocomplete-richlistbox"
      id="PopupAutoComplete"
      role="group"
      noautofocus="true"
      hidden="true"
      norolluponanchor="true"
      nomaxresults="true"
    />

    <div id="shields-popup" class="popover" hidden="hidden"></div>
    <div id="qr-popup" class="popover" hidden="hidden"></div>
    <div id="tabsearch" hidden="hidden">
      <div id="tabsearch-box">
        <input
          id="tabsearch-input"
          type="text"
          placeholder="Tabs durchsuchen"
        />
        <div id="tabsearch-list" class="item-list"></div>
      </div>
    </div>
    <div id="toast" hidden="hidden"></div>
  </body>
</html>
